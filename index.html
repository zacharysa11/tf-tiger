<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TF Tiger A1/4 Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* WOC console: slim status bar on top, icon rail (laptop) or bottom bar (phone), dense cards; Tiger red is the only accent, triage/FMC colors are semantic. */
:root{
  --bg:#0a0e13; --panel:#111821; --panel2:#16202b; --soft:#1a2531; --line:#233142; --line2:#2d3e52;
  --ink:#e4ebf2; --muted:#8597a8; --dim:#5d6f81;
  --accent:#ef4b4b; --accent-ink:#ffffff; --accentbg:rgba(239,75,75,.14);
  --ok:#34c77b; --okbg:rgba(52,199,123,.14); --warn:#f2b632; --warnbg:rgba(242,182,50,.14);
  --bad:#ff5f5f; --badbg:rgba(255,95,95,.15); --info:#4ba3ff; --infobg:rgba(75,163,255,.14);
  --blk:#d7dee6; --blkbg:rgba(215,222,230,.12);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35);
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-mode="light"]{
  --bg:#eef1f4; --panel:#ffffff; --panel2:#f6f8fa; --soft:#eef2f6; --line:#d6dde4; --line2:#c3ccd6;
  --ink:#141b22; --muted:#5a6876; --dim:#8794a1;
  --accent:#c62828; --accent-ink:#ffffff; --accentbg:rgba(198,40,40,.09);
  --ok:#1b7f45; --okbg:#e2f4ea; --warn:#946200; --warnbg:#fbf0d3; --bad:#c62828; --badbg:#fbe4e2; --info:#1f5fa8; --infobg:#e3eefa;
  --blk:#1b1b1b; --blkbg:#e2e2e2; --shadow:0 1px 2px rgba(20,27,34,.06),0 6px 18px rgba(20,27,34,.06); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono)}
.muted{color:var(--muted)}.small{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:8px 14px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),transparent 60%)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.patch{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 12px var(--display);letter-spacing:.04em;box-shadow:0 0 0 3px var(--accentbg)}
.bt b{display:block;font:700 15px/1.05 var(--display);letter-spacing:.08em}
.bt small{display:block;font:500 10.5px/1.2 var(--mono);letter-spacing:.06em;color:var(--muted)}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--muted);font:600 12px var(--body);white-space:nowrap}
.seg button b{font:700 13px var(--display);color:var(--ink);margin-right:4px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}
.seg button[aria-pressed="true"] b{color:var(--accent)}
.ticker{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.tick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:2px 9px;font:600 12px var(--body);white-space:nowrap;cursor:pointer}
.tick .mono{font-weight:600}
.tick.bad{border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:var(--badbg);color:var(--bad)}
.tick.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:var(--warnbg);color:var(--warn)}
.tick.ok{color:var(--ok)}
.clock{display:flex;flex-direction:column;align-items:flex-end;font:600 15px/1.1 var(--mono)}
.clock small{font:500 10.5px var(--mono);color:var(--muted)}
.hbtns{display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2.4s infinite}
.dot.local{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.iconbtn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;height:30px;min-width:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:600 12px var(--body)}
.iconbtn svg{width:16px;height:16px}
/* layout */
.app{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:calc(100% - 50px)}
.rail{position:sticky;top:50px;align-self:start;height:calc(100vh - 50px);display:flex;flex-direction:column;gap:4px;padding:10px 8px;border-right:1px solid var(--line);background:var(--panel)}
.rail button,.bnav button{position:relative;border:0;background:transparent;color:var(--muted);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font:600 10.5px var(--body);letter-spacing:.02em}
.rail button svg,.bnav button svg{width:21px;height:21px}
.rail button:hover{background:var(--soft);color:var(--ink)}
.rail button[aria-current="page"],.bnav button[aria-current="page"]{background:var(--accentbg);color:var(--accent)}
.rail button[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.badge{position:absolute;top:2px;right:8px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font:700 10px/17px var(--body);text-align:center}
.bnav{display:none}
main{padding:14px 18px 60px;display:grid;gap:14px;align-content:start;min-width:0}
.pagehead{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.pagehead h1{margin:0;font:700 22px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.pagehead .sub{color:var(--muted);font-size:12px}
.pagehead .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}.rail{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
  main{padding:12px 12px 96px}
  .topbar{padding:7px 12px;gap:8px}
  .bt small{display:none}
  .ticker{order:5;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .clock{font-size:14px}
}
.banner{padding:9px 12px;border-radius:9px;background:var(--warnbg);color:var(--warn);font-weight:500;border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
/* cards & kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 12px 8px;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.kpi b{display:block;font:700 26px/1.1 var(--display);letter-spacing:.01em}
.kpi span{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi.ok::before{background:var(--ok)}.kpi.warn::before{background:var(--warn)}.kpi.bad::before{background:var(--bad)}.kpi.blk::before{background:var(--blk)}.kpi.info::before{background:var(--info)}
.kpi.bad b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;box-shadow:var(--shadow)}
.card h2{font:700 13px var(--display);letter-spacing:.09em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.card h2::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent)}
.card h2 .sub{font:500 12px var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
.card h2 .right{margin-left:auto;display:flex;gap:6px}
.alerts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.alerts li{padding:7px 10px;border-radius:8px;border:1px solid transparent;border-left:3px solid;font-size:13px}
.alerts .bad{background:var(--badbg);border-left-color:var(--bad)}.alerts .warn{background:var(--warnbg);border-left-color:var(--warn)}.alerts .ok{background:var(--okbg);border-left-color:var(--ok)}.alerts .info{background:var(--infobg);border-left-color:var(--info)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font:700 11px/18px var(--body);letter-spacing:.03em;white-space:nowrap;border:1px solid transparent;text-transform:uppercase}
.s-EFF{background:var(--okbg);color:var(--ok)}.s-WIAY{background:var(--warnbg);color:var(--warn)}.s-WIAR{background:var(--badbg);color:var(--bad)}
.s-WIAB{background:var(--blkbg);color:var(--blk)}.s-KIA{background:var(--blk);color:var(--bg)}.s-MIA{background:var(--infobg);color:var(--info);border-color:var(--info)}
.e-FMC{background:var(--okbg);color:var(--ok)}.e-PMC{background:var(--warnbg);color:var(--warn)}.e-NMC{background:var(--badbg);color:var(--bad)}
.st-Planned{background:var(--soft);color:var(--muted);border-color:var(--line)}.st-Out{background:var(--infobg);color:var(--info)}.st-RTB{background:var(--warnbg);color:var(--warn)}.st-Complete{background:var(--okbg);color:var(--ok)}.st-Scrubbed{background:var(--blkbg);color:var(--dim)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search],.inp{flex:1 1 200px;min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.tools select,.sel{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--muted)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.lg{padding:10px 16px;font-size:15px}
.btn.ghost{background:transparent}
.btn.okb{background:var(--okbg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.btn.badb{background:var(--badbg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.warnb{background:var(--warnbg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.btn.infob{background:var(--infobg);color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 11px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--panel2);position:sticky;top:0}
tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover{background:var(--soft)}
tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.lanegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.mission{border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:10px;display:grid;gap:6px;align-content:start}
.mission.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px var(--accentbg)}
.mission.warnc{box-shadow:inset 3px 0 0 var(--warn)}.mission.badc{box-shadow:inset 3px 0 0 var(--bad)}
.mhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mhead b{font:700 15px var(--display);letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;cursor:pointer;background:var(--soft)}
.chip.mc{font-weight:700;border-color:var(--muted)}
.chip.s-WIAY,.chip.s-WIAR,.chip.s-WIAB,.chip.s-KIA,.chip.s-MIA{border-color:transparent}
.blockh{font:700 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px;display:flex;gap:8px;align-items:center}
.blockh.now{color:var(--accent)}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:12px}
.bar i{display:block;height:12px;border-radius:3px;background:var(--info);min-width:2px}
.bar.floor i{background:var(--accent)}
.slide{border:1px solid var(--line2);border-radius:12px;padding:14px 16px;background:var(--panel);display:grid;gap:10px;box-shadow:var(--shadow)}
.slide h3{margin:0;font:700 19px var(--display);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;border-bottom:2px solid var(--accent);padding-bottom:6px}
.slide .big{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.slide .big div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel2);font-size:12px;color:var(--muted)}
.slide .big b{display:block;font:700 24px var(--display);color:var(--ink)}
.slide ul{margin:0;padding-left:18px}
.log{display:grid}
.logrow{display:grid;grid-template-columns:58px 1fr auto;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);align-items:start}
.logrow .t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.logrow.ccir{background:var(--badbg);border-radius:6px}
dialog{border:1px solid var(--line2);border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(580px,calc(100% - 20px));max-height:calc(100% - 20px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(3,6,10,.6);backdrop-filter:blur(2px)}
.dlg{display:grid;gap:10px;padding:14px 16px}
.dlg h3{margin:0;font:700 18px var(--display);letter-spacing:.03em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fields label,.fl{display:grid;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fields input,.fields select,.fields textarea{padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font-weight:400;font-size:14px;text-transform:none;letter-spacing:0}
.fields .wide{grid-column:1/-1}
.picker{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.picker label{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:6px 9px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);font-weight:400;cursor:pointer}
.picker label:hover{background:var(--soft)}
.picker label.busy{opacity:.55}
.dfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.dfoot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.hist{font-size:12px;color:var(--muted);margin:0;padding-left:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:10px;z-index:60;font-weight:600;max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.empty{padding:18px;text-align:center;color:var(--muted)}
/* A3 */
.queue{display:grid;gap:6px}
.qi{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--line2)}
.qi.bad{border-left-color:var(--bad);background:linear-gradient(90deg,var(--badbg),var(--panel2) 55%)}
.qi.warn{border-left-color:var(--warn);background:linear-gradient(90deg,var(--warnbg),var(--panel2) 55%)}
.qi.info{border-left-color:var(--info)}
.qi .due{font:700 14px/1.1 var(--mono);text-align:center}
.qi .due small{display:block;font:600 10.5px var(--body);color:var(--muted);margin-top:2px}
.qi.bad .due{color:var(--bad)}.qi.warn .due{color:var(--warn)}
.qi .tt{font-weight:600;line-height:1.25}.qi .ss{font-size:12px;color:var(--muted)}
.qi .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.qi{grid-template-columns:52px 1fr}.qi .act{grid-column:1/-1;justify-content:stretch}.qi .act .btn{flex:1}}
.allclear{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:var(--okbg);color:var(--ok);font-weight:600}
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.tlin{position:relative;min-width:760px;padding:22px 10px 8px 70px}
.tlhr{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line);font:500 10.5px var(--mono);color:var(--dim)}
.tlhr span{position:absolute;top:4px;left:4px}
.tlrow{position:relative;height:30px;margin:4px 0}
.tlrow .ln{position:absolute;left:-62px;top:6px;width:56px;font:700 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right}
.tlbar{position:absolute;top:2px;height:26px;border-radius:7px;padding:0 8px;display:flex;align-items:center;gap:6px;font:600 11.5px var(--body);white-space:nowrap;overflow:hidden;cursor:pointer;border:1px solid var(--line2);background:var(--soft);color:var(--ink)}
.tlbar.Out{background:var(--info);border-color:var(--info);color:#04121f}
.tlbar.RTB{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.tlbar.Complete{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.tlbar.Scrubbed{opacity:.45;text-decoration:line-through}
.tlbar.nogo{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.tlbar.go::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.tlnow{position:absolute;top:16px;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);z-index:2}
.tlnow span{position:absolute;top:-16px;left:-18px;background:var(--accent);color:#fff;font:700 10px var(--mono);padding:1px 5px;border-radius:4px}
.mrows{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.mrow.live{border-color:var(--info);box-shadow:0 0 0 1px var(--info)}
.mrow .tm{font:700 14px/1.15 var(--mono)}.mrow .tm small{display:block;font:500 11px var(--mono);color:var(--muted)}
.mrow .nm{font:700 15px var(--display);letter-spacing:.03em}
.steps{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.steps i{font:700 9.5px/16px var(--body);letter-spacing:.06em;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--dim);font-style:normal}
.steps i.done{background:var(--okbg);color:var(--ok)}.steps i.cur{background:var(--infobg);color:var(--info);box-shadow:0 0 0 1px var(--info) inset}.steps i.no{background:var(--badbg);color:var(--bad)}
.mrow .acts{display:flex;gap:6px;align-items:center}
@media (max-width:560px){.mrow{grid-template-columns:62px minmax(0,1fr)}.mrow .acts{grid-column:1/-1}.mrow .acts .btn.pri{flex:1}}

/* ---------- helpers ---------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nowParts(){const f=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const g=t=>f.find(x=>x.type===t).value;return{date:`${g('year')}-${g('month')}-${g('day')}`,hm:g('hour')+g('minute')}}
function autoDay(){const d=nowParts().date;const m=BASE.days.find(x=>x.date===d);return m?m.id:BASE.days[0].id}
function fmtT(ms){if(!ms)return'';return new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ms)).replace(':','')}
function fmtDT(ms){if(!ms)return'';return new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ms))}
function nm(pid){return P[pid]?P[pid].name:(pid||'—')}
function short(pid){const n=nm(pid);const [l,f]=n.split(', ');return f?`${l}, ${f[0]}`:n}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function laneOf(m){return m.lane}
function isMission(m){return !(m.lane==='WOC'||m.lane==='TOC')}
function hhmm(s){return String(s||'').padStart(4,'0')}
function dayObj(id){return DAYS.find(d=>d.id===id)}

/* ---------- derived ---------- */
function person(pid){return Object.assign({status:'EFF',adj:0,exHist:[],role:P[pid]?.role||''},P[pid],S.people[pid]||{})}
function allMissions(){
  const out=[];const seen=new Set();
  BASE.slots.forEach(b=>{seen.add(b.id);const o=S.missions[b.id];const m=Object.assign({state:'Planned',note:'',base:true},b,o||{});m.id=b.id;m.members=(m.members||[]).filter(x=>x&&x!==m.mc);if(!m.deleted)out.push(m)});
  for(const id in S.missions){if(seen.has(id))continue;const m=Object.assign({state:'Planned',members:[]},S.missions[id]);m.id=id;m.members=(m.members||[]).filter(x=>x&&x!==m.mc);if(!m.deleted)out.push(m)}
  return out.sort((a,b)=>a.day.localeCompare(b.day)||hhmm(a.start).localeCompare(hhmm(b.start))||String(a.lane).localeCompare(String(b.lane)));
}
function crew(m){return [m.mc,...m.members].filter(Boolean)}
function overlap(a,b){return a.day===b.day&&hhmm(a.start)<hhmm(b.end)&&hhmm(b.start)<hhmm(a.end)}
function missionCounts(ms){const c={};ROSTER.forEach(p=>c[p.pid]=0);
  ms.forEach(m=>{if(isMission(m)&&m.state==='Complete')crew(m).forEach(x=>{if(x in c)c[x]++})});
  for(const k in c)c[k]+=Number(S.people[k]?.adj||0);return c}
function staffOn(day,ms){const s=new Set();ms.forEach(m=>{if(m.day===day&&!isMission(m))crew(m).forEach(x=>s.add(x))});return s}
function exempt(pid,day,ms){const r=person(pid).role;return r==='IDO'||['ATF/CC','A-Staff','CABS/CC','TOC key personnel'].includes(r)||staffOn(day,ms).has(pid)}
function floorOf(c,day,ms){let f=Infinity;ROSTER.forEach(p=>{if(!exempt(p.pid,day,ms)&&person(p.pid).role!=='Chaplain')f=Math.min(f,c[p.pid])});return f===Infinity?0:f}
function whereNow(pid,ms){const n=nowParts();const day=dayObj(UI.day);const t=(day&&day.date===n.date)?n.hm:null;
  const mine=ms.filter(m=>m.day===UI.day&&crew(m).includes(pid));
  if(t){const cur=mine.find(m=>hhmm(m.start)<=t&&t<hhmm(m.end)&&m.state!=='Scrubbed');if(cur)return{m:cur,now:true}}
  return{list:mine}}
function casualtiesFor(mid){return Object.values(S.log).filter(l=>l.type==='cas'&&l.mid===mid&&l.to!=='EFF').reduce((s,l)=>s.add(l.pid),new Set()).size}
function curBlock(){const n=nowParts();const day=dayObj(UI.day);if(!day||day.date!==n.date)return null;return n.hm}
function analyze(){
  const ms=allMissions();const c=missionCounts(ms);const fl=floorOf(c,UI.day,ms);
  const alerts=[];const flags={};
  const dayMs=ms.filter(m=>m.day===UI.day);
  // double booking
  dayMs.forEach((a,i)=>dayMs.slice(i+1).forEach(b=>{if(a.state==='Scrubbed'||b.state==='Scrubbed')return;if(!overlap(a,b))return;crew(a).forEach(x=>{if(crew(b).includes(x)){alerts.push({k:'bad',t:`${short(x)} is double-booked: ${a.lane} ${a.start} and ${b.lane} ${b.start}`,mid:a.id});flags[a.id]='bad';flags[b.id]='bad'}})}));
  // participation rule, projected through the remaining plan in time order (missions in the same block run together)
  const proj=Object.assign({},c);
  DAYS.forEach(D=>{const pend=ms.filter(m=>m.day===D.id&&isMission(m)&&(m.state==='Planned'||m.state==='Out'));
   const starts=[...new Set(pend.map(m=>hhmm(m.start)))].sort();
   const nonEx=ROSTER.filter(p=>!exempt(p.pid,D.id,ms)&&person(p.pid).role!=='Chaplain').map(p=>p.pid);
   starts.forEach(st=>{const grp=pend.filter(m=>hhmm(m.start)===st);const f=Math.min(...nonEx.map(x=>proj[x]));const behind=nonEx.filter(x=>proj[x]===f&&!grp.some(m=>crew(m).includes(x))).length;
    if(D.id===UI.day)grp.forEach(m=>{const over=crew(m).filter(x=>nonEx.includes(x)&&proj[x]>f);
      if(over.length&&behind){alerts.push({k:'warn',part:1,t:`${m.lane} ${m.start}: ${over.map(x=>short(x)+' (#'+(proj[x]+1)+')').join('; ')} would go again while ${behind} member${behind>1?'s are':' is'} still at ${f} (Annex B II.1)`,mid:m.id});flags[m.id]=flags[m.id]||'warn'}});
    grp.forEach(m=>crew(m).forEach(x=>{if(x in proj)proj[x]++}))});
   if(D.id!==UI.day&&DAYS.indexOf(D)<DAYS.findIndex(d=>d.id===UI.day)){const endF=Math.min(...nonEx.map(x=>proj[x]));staffOn(D.id,ms).forEach(x=>{if(x in proj&&proj[x]<endF)proj[x]=endF})}});
  dayMs.filter(m=>isMission(m)&&(m.state==='Planned'||m.state==='Out')).forEach(m=>{
    const unfit=crew(m).filter(x=>['WIAR','WIAB','KIA','MIA'].includes(person(x).status));
    if(unfit.length){alerts.push({k:'bad',t:`${m.lane} ${m.start}: ${unfit.map(x=>short(x)+' ('+SLBL[person(x).status]+')').join('; ')} not returned to duty`,mid:m.id});flags[m.id]='bad'}
    const ch=crew(m).filter(x=>person(x).role==='Chaplain');if(ch.length>1){alerts.push({k:'warn',t:`${m.lane} ${m.start}: more than one chaplain (Annex B II.7)`,mid:m.id})}
  });
  // >5 casualties CCIR
  ms.forEach(m=>{const n=casualtiesFor(m.id);if(n>5)alerts.push({k:'bad',t:`CCIR: ${m.lane} ${m.start} (Day ${m.day}) has ${n} casualties. Report to ATF/CC.`,mid:m.id})});
  // exercises owed
  ROSTER.forEach(p=>{const x=person(p.pid);if(x.exStatus==='Owed'&&!x.exercise)alerts.push({k:'info',t:`${short(p.pid)} owes an exercise choice`,pid:p.pid});
    if(x.exercise==='60-min timeout'&&x.exStatus==='In progress'&&x.exStart&&Date.now()-x.exStart>=3600000)alerts.push({k:'ok',t:`${short(p.pid)} timeout complete (60 min elapsed). Confirm RTD.`,pid:p.pid})});
  dayMs.filter(m=>isMission(m)&&m.state!=='Scrubbed'&&m.state!=='Complete'&&crew(m).length>10).forEach(m=>{alerts.push({k:'bad',t:`${m.lane} ${m.start}: ${crew(m).length} pax, over the 10-person FRAGO limit`,mid:m.id});flags[m.id]='bad'});
  a3Alerts({dayMs}).forEach(x=>alerts.push(x));
  // equipment NMC
  Object.entries(S.equip).forEach(([id,e])=>{if(Number(e.nmc)>0)alerts.push({k:'warn',t:`${e.name}: ${e.nmc} NMC`,eid:id});
    if(e.cat==='Medical'&&e.chips!=null&&e.chips!==''&&Number(e.chips)<=3)alerts.push({k:'warn',t:`${e.name}: only ${e.chips} poker chips left. Request resupply through CABS/CC.`,eid:id})});
  return{ms,c,fl,alerts,flags,dayMs};
}

function missionCard(m,A,now){

function fragoDone(){const s=new Set();allMissions().forEach(m=>{if(m.frago&&m.state==='Complete'&&!(m.aar&&/Not complete|Failed/.test(m.aar.result||'')))s.add(m.frago)});return s}
function failedMissions(){return allMissions().filter(m=>m.state==='Scrubbed'||(m.aar&&/Not complete|Failed|Partial/.test(m.aar.result||'')))}
function readiness(fid,m){const p=PREREQ[fid]||{};const done=fragoDone();const out={blocked:[],missing:[],soft:[],ok:true};
  (p.needs||[]).forEach(k=>{if(!done.has(k))out.blocked.push(`${FR[k].no} ${FR[k].name} must be complete first`)});
  if(p.failed&&!failedMissions().length)out.blocked.push('No failed or partial mission to reattempt yet');
  (p.soft||[]).forEach(([k,l])=>{if(l&&!done.has(k))out.soft.push(l)});
  const inp=inputsOf(fid,m);(p.inputs||[]).forEach(([k,l,opt])=>{if(!opt&&!String(inp[k]||'').trim())out.missing.push(l)});
  out.state=out.blocked.length?'blocked':out.missing.length?'input':'ready';return out}
function readyPill(fid,m){const r=readiness(fid,m);return r.state==='blocked'?'<span class="pill e-NMC">Blocked</span>':r.state==='input'?'<span class="pill e-PMC">Needs WOC input</span>':'<span class="pill e-FMC">Ready</span>'}

  const fields=(p.inputs||[]).map(([k,l,o])=>editable?`<label class="wide">${esc(l)}${o?' (optional)':''}<input name="inp_${k}" value="${esc(inp[k]||'')}"></label>`:`<div class="small">${esc(l)}: ${inp[k]?`<b>${esc(inp[k])}</b>`:'<span style="color:var(--warn)">not yet</span>'}</div>`).join('');
  if(!lines.length&&!fields)return `<div class="small"><span class="pill e-FMC">Ready</span> No prerequisites.</div>`;
  return `<div class="fl" style="margin-top:4px">Prerequisites &amp; WOC inputs ${readyPill(fid,m)}</div>${lines.length?`<ul class="alerts">${lines.join('')}</ul>`:''}${fields?(editable?`<div class="fields">${fields}</div>`:fields):''}`}

function saveAar(){const f=document.getElementById('aarform');const fd=new FormData(f);const id=f.dataset.mid;const m=allMissions().find(x=>x.id===id);const had=!!m.aar;const fr=fragoOf(m);
  const a={};['result','from','summary','contact','contactyn','equip','sustain','improve','follow','ekia'].forEach(k=>a[k]=String(fd.get(k)??'').trim());
  a.data={};if(fr)fr.data.forEach(([k])=>{const v=fd.get('d_'+k);if(v!=null&&String(v).trim()!=='')a.data[k]=String(v).trim()});
  a.at=(m.aar&&m.aar.at)||Date.now();a.by=ME||null;a.cas=casualtiesFor(id);a.pax=crew(m).length;
  patchMission(id,{aar:a});
  const intelBits=fr?fr.data.filter(([k,,,i])=>i&&a.data[k]).map(([k,l])=>`${l}: ${a.data[k]}`):[];
  const oldBits=JSON.stringify((m.aar&&m.aar.data)||{})+((m.aar&&m.aar.contact)||'');
  if((a.contact||intelBits.length)&&oldBits!==JSON.stringify(a.data)+a.contact)addIntel({mid:id,activity:`AAR intel · ${mName(m)}`,text:[a.contact,...intelBits].filter(Boolean).join(' | '),time:m.end,source:'AAR',unit:'Raider'});
  logIt({type:'aar',mid:id,text:`AAR ${had?'updated':'received'}: ${mName(m)} ${m.start} · ${a.result}${a.ekia?' · '+a.ekia+' enemy cas':''}${a.contact?' · contact reported':''}${a.equip?' · equipment issue':''}`});closeDlg()}

let TOUR=null;
function tourVisible(sel){for(const s of sel.split(',')){const els=[...document.querySelectorAll(s)];const el=els.find(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0});if(el)return el}return null}
function startTour(name,thenA3){const steps=TOURS[name];if(!steps)return;if(dlg.open)closeDlg();
  if(name!=='intro'&&UI.tab!==name)setTab(name);
  TOUR={name,steps,i:0,thenA3};if(!document.getElementById('tourov')){document.body.insertAdjacentHTML('beforeend','<div id="tourov" aria-hidden="false"><div id="tourhole"></div><div id="tourtip" role="dialog" aria-live="polite"></div></div>')}
  try{localStorage.setItem('tftiger-toured','1')}catch(e){}
  setTimeout(()=>tourGo(0),60)}
function tourGo(i){if(!TOUR)return;const n=TOUR.steps.length;
  while(i<n&&!tourVisible(TOUR.steps[i].sel))i+=(i>=TOUR.i?1:-1);
  if(i<0)i=0;
  if(i>=n){const then=TOUR.thenA3;endTour();if(then){startTour('a3')}return}
  TOUR.i=i;const st=TOUR.steps[i];const el=tourVisible(st.sel);
  el.scrollIntoView({block:'center',behavior:'instant'});
  const tip=document.getElementById('tourtip');
  const last=i===n-1&&!TOUR.thenA3;
  tip.innerHTML=`<div class="small muted mono">${TOUR.name==='intro'?'Tour':esc(TITLES[TOUR.name][0])} · ${i+1} of ${n}${TOUR.thenA3?' · A3 next':''}</div><h4>${esc(st.title)}</h4><p>${esc(st.text)}</p><div class="tools"><button type="button" class="btn sm ghost" data-tour="end">${last?'Close':'Skip'}</button><span style="margin-left:auto"></span>${i>0?'<button type="button" class="btn sm" data-tour="back">Back</button>':''}<button type="button" class="btn sm pri" data-tour="next">${last?'Done':TOUR.thenA3&&i===n-1?'Continue to A3':'Next'}</button></div>`;
  tourPlace();setTimeout(tourPlace,80);const nb=tip.querySelector('[data-tour="next"]');if(nb)nb.focus({preventScroll:true})}
function tourPlace(){if(!TOUR)return;const st=TOUR.steps[TOUR.i];const el=tourVisible(st.sel);const hole=document.getElementById('tourhole'),tip=document.getElementById('tourtip');if(!el||!hole)return;
  const r=el.getBoundingClientRect();const pad=6;const vw=innerWidth,vh=innerHeight;
  const top=Math.max(4,r.top-pad),left=Math.max(4,r.left-pad),w=Math.min(vw-8,r.width+pad*2),h=Math.min(vh-8,r.height+pad*2);
  Object.assign(hole.style,{top:top+'px',left:left+'px',width:w+'px',height:h+'px'});
  const tw=Math.min(360,vw-24);tip.style.width=tw+'px';const th=tip.offsetHeight;
  let ty=top+h+10;if(ty+th>vh-8)ty=top-th-10;if(ty<8)ty=Math.min(vh-th-8,Math.max(8,top+12));
  let tx=Math.min(Math.max(12,left),vw-tw-12);tip.style.top=ty+'px';tip.style.left=tx+'px'}
function endTour(){TOUR=null;const o=document.getElementById('tourov');if(o)o.remove()}
addEventListener('resize',tourPlace);addEventListener('scroll',tourPlace,{passive:true});
document.addEventListener('click',e=>{const b=e.target.closest('[data-tour]');if(!b)return;e.stopPropagation();const a=b.dataset.tour;

document.addEventListener('keydown',e=>{if(!TOUR)return;if(e.key==='Escape'){endTour();e.preventDefault()}else if(e.key==='ArrowRight'){tourGo(TOUR.i+1);e.preventDefault()}else if(e.key==='ArrowLeft'){tourGo(TOUR.i-1);e.preventDefault()}},true);

  if(n.status!==old.status){n.tocNotified=false;if(n.status!=='EFF'&&old.status==='EFF'&&(!n.exStatus||n.exStatus==='Complete')&&n.exercise===(old.exercise||'')){n.exStatus='Owed';n.exercise=''}}

  else n.exStart=(n.exercise==='60-min timeout'?old.exStart:null)||null;

    const last=name.split(/[ ,]+/)[0];const rest=name.slice(last.length).replace(/[ ,]+/g,' ').trim();
    let c=ROSTER.filter(p=>p.name.toLowerCase().split(',')[0].trim()===last);
    if(c.length>1&&rest)c=c.filter(p=>(p.name.toLowerCase().split(',')[1]||'').trim().startsWith(rest.split(' ')[0]));
    if(c.length===1){const inp=document.querySelector(`[data-spid="${c[0].pid}"]`);if(inp){inp.value=serial;ok++}}else miss.push(line)});
  document.getElementById('pastemsg').textContent=`Filled ${ok}.`+(miss.length?` Not matched: ${miss.slice(0,4).join(' | ')}${miss.length>4?' …':''}`:'')}
function saveSerials(){const f=document.getElementById('sform');const eid=f.dataset.eid;const name=S.equip[eid]?.name||'item';
  const vals={};f.querySelectorAll('[data-spid]').forEach(i=>vals[i.dataset.spid]=i.value.trim());
  const cnt={};Object.values(vals).filter(Boolean).forEach(v=>cnt[v.toLowerCase()]=(cnt[v.toLowerCase()]||0)+1);
  const dups=Object.keys(cnt).filter(k=>cnt[k]>1);if(dups.length){toast('Duplicate serial: '+dups.slice(0,3).join(', ')+'. Fix it before saving.');return}
  let issued=0,changed=0;
  ROSTER.forEach(p=>{const v=vals[p.pid];const g=gearOf(p.pid);const cur=g[eid];
    if(!v&&!cur)return;if(cur&&String(cur.serial||'')===v)return;
    if(!cur&&v){setGear(p.pid,Object.assign({},g,{[eid]:{qty:1,serial:v,ts:Date.now()}}));issued++}
    else if(cur){setGear(p.pid,Object.assign({},g,{[eid]:Object.assign({},cur,{serial:v})}));changed++}});
  if(issued||changed)logIt({type:'gear',text:`${name} serials recorded: ${changed} updated${issued?`, ${issued} newly issued`:''}`});
  toast(issued||changed?'Serials saved':'No changes');closeDlg()}
function issueGear(){const f=document.getElementById('gform');const fd=new FormData(f);const pid=f.dataset.pid;const eid=fd.get('eid');if(!eid){toast('Choose an item to issue.');return}
  const qty=Math.max(1,Number(fd.get('qty')||1));const serial=String(fd.get('serial')||'').trim();const g=Object.assign({},gearOf(pid));const had=g[eid];
  g[eid]={qty,serial,ts:Date.now()};setGear(pid,g);
  logIt({type:'gear',pid,text:`${had?'Updated':'Issued'} ${qty} × ${S.equip[eid]?.name||'item'}${serial?' (#'+serial+')':''} ${had?'for':'to'} ${nm(pid)}`});gearDlg(pid)}
function returnGear(pid,eid){const g=Object.assign({},gearOf(pid));const x=g[eid];if(!x)return;delete g[eid];setGear(pid,g);
  logIt({type:'gear',pid,text:`${nm(pid)} returned ${x.qty||1} × ${S.equip[eid]?.name||'item'}${x.serial?' (#'+x.serial+')':''}`});gearDlg(pid)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){openDlg(`<div class="dlg"><h3>Copy this text</h3><textarea rows="12" style="width:100%" readonly>${esc(t)}</textarea></div><div class="dfoot"><button type="button" class="btn" data-act="close">Close</button></div>`)}}

function subscribe(){unsubs.forEach(u=>u());unsubs=[];

  unsubs.push(FB.onSnapshot(FB.query(FB.collection(FB.db,'log'),FB.orderBy('ts','desc'),FB.limit(600)),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.log=o;render()},()=>{}));
}
window.bootFirebase=function(){

  if(!C||!C.apiKey||String(C.apiKey).startsWith('PASTE')){MODE='setup';render();return}
  const app=FB.initializeApp(C);FB.db=FB.getFirestore(app);CAN_EDIT=true;
  try{ME=localStorage.getItem('tftiger-who')||null}catch(e){}
  subscribe();render();
};

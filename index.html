<style>
/* Ops-board layout: status strip on top, tabbed work areas below; semantic triage + FMC colors kept apart from the Tiger-red accent. */
:root{
  --bg:#eef0f2; --panel:#ffffff; --ink:#1b2127; --muted:#5c6670; --line:#d5dade; --soft:#f4f5f7;
  --accent:#b3261e; --accent-ink:#ffffff;
  --ok:#1f7a3f; --okbg:#e3f3e8; --warn:#9a6a00; --warnbg:#fbf1d6; --bad:#b3261e; --badbg:#fae3e1;
  --blk:#1b1b1b; --blkbg:#d9d9d9; --info:#22578f; --infobg:#e2ecf7;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161a; --panel:#1b2026; --ink:#e7eaed; --muted:#9aa4ad; --line:#2e353d; --soft:#222830;
  --accent:#e0574d; --accent-ink:#1a0b0a;
  --ok:#5cc785; --okbg:#173323; --warn:#e5b543; --warnbg:#3a2f12; --bad:#f07a70; --badbg:#3d1d1b;
  --blk:#f2f2f2; --blkbg:#3a3a3a; --info:#7fb2ea; --infobg:#18293d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161a; --panel:#1b2026; --ink:#e7eaed; --muted:#9aa4ad; --line:#2e353d; --soft:#222830;
  --accent:#e0574d; --accent-ink:#1a0b0a;
  --ok:#5cc785; --okbg:#173323; --warn:#e5b543; --warnbg:#3a2f12; --bad:#f07a70; --badbg:#3d1d1b;
  --blk:#f2f2f2; --blkbg:#3a3a3a; --info:#7fb2ea; --infobg:#18293d; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
header.top{background:var(--panel);border-bottom:3px solid var(--accent);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.patch{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--display)}
.brand h1{font:700 18px/1.1 var(--display);margin:0;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:12px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button,.tabs button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:5px 10px;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.clock{margin-left:auto;display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:13px}
.sync{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--body);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok)} .dot.local{background:var(--warn)}
nav.tabs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto}
.tabs button{white-space:nowrap;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs .ct{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--badbg);color:var(--bad);font-size:11px}
.tabs button[aria-selected="true"] .ct{background:var(--accent-ink);color:var(--accent)}
main{padding:12px 16px 40px;display:grid;gap:14px}
.banner{padding:8px 12px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:8px 10px}
.kpi b{display:block;font:700 26px/1.1 var(--display)}
.kpi span{color:var(--muted);font-size:12px}
.kpi.ok{border-left-color:var(--ok)} .kpi.warn{border-left-color:var(--warn)} .kpi.bad{border-left-color:var(--bad)} .kpi.blk{border-left-color:var(--blk)} .kpi.info{border-left-color:var(--info)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card h2{font:700 15px var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.card h2 .sub{font:400 12px var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}
.card h2 .right{margin-left:auto}
.alerts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.alerts li{padding:6px 10px;border-radius:6px;border-left:4px solid}
.alerts .bad{background:var(--badbg);border-color:var(--bad)} .alerts .warn{background:var(--warnbg);border-color:var(--warn)} .alerts .ok{background:var(--okbg);border-color:var(--ok)} .alerts .info{background:var(--infobg);border-color:var(--info)}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.s-EFF{background:var(--okbg);color:var(--ok)} .s-WIAY{background:var(--warnbg);color:var(--warn)} .s-WIAR{background:var(--badbg);color:var(--bad)}
.s-WIAB{background:var(--blkbg);color:var(--blk)} .s-KIA{background:var(--blk);color:var(--panel)} .s-MIA{background:var(--infobg);color:var(--info);border-color:var(--info)}
.e-FMC{background:var(--okbg);color:var(--ok)} .e-PMC{background:var(--warnbg);color:var(--warn)} .e-NMC{background:var(--badbg);color:var(--bad)}
.st-Planned{background:var(--soft);color:var(--muted);border-color:var(--line)} .st-Out{background:var(--infobg);color:var(--info)} .st-RTB{background:var(--warnbg);color:var(--warn)} .st-Complete{background:var(--okbg);color:var(--ok)} .st-Scrubbed{background:var(--blkbg);color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{flex:1 1 200px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.tools select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{background:transparent}
.btn.okb{background:var(--okbg);color:var(--ok);border-color:transparent} .btn.badb{background:var(--badbg);color:var(--bad);border-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--soft);position:sticky;top:0}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--soft)}
tr.flag td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.muted{color:var(--muted)} .small{font-size:12px}
.lanegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.mission{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:10px;display:grid;gap:6px;align-content:start}
.mission.now{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.mission.warnc{border-left:4px solid var(--warn)} .mission.badc{border-left:4px solid var(--bad)}
.mhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mhead b{font:700 15px var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px;cursor:pointer;background:var(--soft)}
.chip.mc{font-weight:700;border-color:var(--ink)}
.chip.s-WIAY,.chip.s-WIAR,.chip.s-WIAB,.chip.s-KIA,.chip.s-MIA{border-color:transparent}
.blockh{font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px;display:flex;gap:8px;align-items:center}
.blockh.now{color:var(--accent)}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:12px}
.bar i{display:block;height:14px;border-radius:3px;background:var(--info);min-width:2px}
.bar.floor i{background:var(--accent)}
.slide{border:2px solid var(--ink);border-radius:6px;padding:14px 16px;background:var(--panel);display:grid;gap:10px;aspect-ratio:auto}
.slide h3{margin:0;font:700 20px var(--display);display:flex;justify-content:space-between;gap:8px;border-bottom:3px solid var(--accent);padding-bottom:6px}
.slide .big{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.slide .big div{border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.slide .big b{display:block;font:700 24px var(--display)}
.slide ul{margin:0;padding-left:18px}
.log{display:grid;gap:0}
.logrow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);align-items:start}
.logrow .t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.logrow.ccir{background:var(--badbg)}
dialog{border:none;border-radius:12px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{display:grid;gap:10px;padding:14px 16px}
.dlg h3{margin:0;font:700 18px var(--display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fields label,.fl{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.fields input,.fields select,.fields textarea{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--ink);font-weight:400;font-size:14px}
.fields .wide{grid-column:1/-1}
.picker{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.picker label{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);font-weight:400}
.picker label.busy{opacity:.55}
.dfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
.dfoot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.hist{font-size:12px;color:var(--muted);margin:0;padding-left:16px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;z-index:50;font-weight:500;max-width:90%}
.empty{padding:18px;text-align:center;color:var(--muted)}
.ro [data-mstate],.ro [data-rs],.ro [data-act=addmission],.ro [data-act=addequip],.ro [data-act=addresupply],.ro [data-act=seedequip],.ro [data-act=equalize],.ro [data-act=rtd],.ro [data-act=tofloor],.ro [data-act=saveperson],.ro [data-act=savemission],.ro [data-act=saveequip],.ro [data-act=saveresupply],.ro [data-act=delmission],.ro [data-act=resetmission],.ro [data-act=delequip],.ro [data-act=delresupply],.ro [data-setstatus],.ro input[data-toc]{display:none!important}
.ro .mission [data-mission]::after{content:""}
#login{position:fixed;inset:0;background:var(--bg);z-index:40;display:grid;place-items:center;padding:16px}
#login[hidden]{display:none}
#login form{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:12px;padding:20px;width:min(380px,100%);display:grid;gap:12px}
#login h2{margin:0;font:700 20px var(--display)}
#login label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
#login input[type=password],#login input[type=email]{padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--soft);font-size:15px}
#login .chk{display:flex;gap:6px;align-items:center;font-weight:500;color:var(--ink)}
#loginmsg{min-height:1.2em;color:var(--bad);font-size:13px;margin:0}
@media (max-width:520px){.clock{margin-left:0;width:100%;justify-content:space-between}.bar{grid-template-columns:70px 1fr 28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function nowMinFor(day){const n=nowParts();const d=dayObj(day);return d&&d.date===n.date?toMin(n.hm):null}

  return CYSTEPS.map(([k,l,off])=>{const due=T-off;const done=m.cyoa[k]&&m.cyoa[k].at;const left=nowM==null?null:due-nowM;return{k,l,off,due:fromMin(due),done,left,late:!done&&left!=null&&left<0,soon:!done&&left!=null&&left>=0&&left<=10}})}

function savePerson(extra){
  const f=document.getElementById('pform');const pid=f.dataset.pid;const old=person(pid);const fd=new FormData(f);
  const n={status:fd.get('status'),source:fd.get('source'),mid:fd.get('mid'),exercise:fd.get('exercise'),exStatus:fd.get('exStatus'),role:fd.get('role'),adj:Number(fd.get('adj')||0),tocNotified:fd.get('tocNotified')==='on',note:fd.get('note')};
  Object.assign(n,extra||{});n.gear=gearOf(pid);
  const ms=allMissions();const mm=ms.find(m=>m.id===n.mid);const mlabel=mm?`Day ${mm.day} ${mm.lane} ${mm.start}`:'';
  if(n.status!==old.status){n.tocNotified=false;if(n.status!=='EFF'&&old.status==='EFF'&&(!n.exStatus||n.exStatus==='Complete')&&n.exercise===(old.exercise||'')){n.exStatus='Owed';n.exercise=''}}
  if(n.exercise==='60-min timeout'&&n.exStatus==='In progress'&&!(old.exercise==='60-min timeout'&&old.exStatus==='In progress'))n.exStart=Date.now();
  else n.exStart=(n.exercise==='60-min timeout'?old.exStart:null)||null;
  let hist=(old.exHist||[]).slice();
  if(n.exercise&&n.exercise!==old.exercise){hist.push({ts:Date.now(),ex:n.exercise,mission:mlabel||(old.mid?'':'')});if(hist.length>40)hist=hist.slice(-40)}
  n.exHist=hist;delete n._rtd;
  writeDoc('people',pid,n);
  const who=nm(pid);
  if(n.status!==old.status){const ccirSoon=mm&&casualtiesFor(mm.id)>=5&&n.status!=='EFF';logIt({type:'cas',pid,mid:n.mid||'',to:n.status,text:`${who}: ${SLBL[old.status]} → ${SLBL[n.status]}${n.source?` (${n.source})`:''}${mlabel?` · ${mlabel}`:''}`,ccir:!!ccirSoon})}
  if(n.exercise&&n.exercise!==old.exercise)logIt({type:'ex',pid,text:`${who} chose ${n.exercise}${mlabel?` after ${mlabel}`:''}`});
  if(n.exStatus!==old.exStatus&&n.exStatus&&n.exStatus!=='Owed')logIt({type:'ex',pid,text:`${who}: exercise ${n.exStatus.toLowerCase()}${n.exercise?` (${n.exercise})`:''}`});
  if(n.adj!==Number(old.adj||0))logIt({type:'adm',pid,text:`${who}: mission count adjusted ${Number(old.adj||0)} → ${n.adj}`});
  if(n.role!==(old.role||''))logIt({type:'adm',pid,text:`${who}: role set to ${n.role||'none'}`});
  closeDlg();
}

function saveResupply(){const f=document.getElementById('rform');if(!f.reportValidity())return;const fd=new FormData(f);let id=f.dataset.rid;const old=id?S.resupply[id]:null;id=id||('r'+uid());
  const n={item:fd.get('item'),qty:fd.get('qty'),status:fd.get('status'),forWhat:fd.get('forWhat'),reqBy:fd.get('reqBy'),note:fd.get('note'),ts:old?old.ts:Date.now()};
  writeDoc('resupply',id,n);
  if(!old)logIt({type:'rs',text:`Resupply requested: ${n.qty} × ${n.item}${n.forWhat?' for '+n.forWhat:''}${n.reqBy?' by '+n.reqBy:''}`});
  else if(old.status!==n.status)logIt({type:'rs',text:`Resupply ${n.status.toLowerCase()}: ${n.qty} × ${n.item}`});
  closeDlg()}
function setResupply(id,st){const r=S.resupply[id];if(!r)return;writeDoc('resupply',id,Object.assign({},r,{status:st}));logIt({type:'rs',text:`Resupply ${st.toLowerCase()} by A1/4: ${r.qty} × ${r.item}`})}

const SEED=[
 {name:'Airsoft M4 carbine (individual issue)',cat:'Weapons',loc:'Individual / armory',note:'Record serials: tap item, then Enter serials'},
 {name:'M4 magazines',cat:'Ammunition',loc:'Individual issue'},
 {name:'Airsoft pellets',cat:'Ammunition',loc:'Armory'},{name:'Green gas',cat:'Ammunition',loc:'Armory'},
 {name:'Plastic clearing rods',cat:'Ammunition',loc:'Armory'},{name:'Speed loaders',cat:'Ammunition',loc:'Armory'},
 {name:'Joint First Aid Kit (JFAK)',cat:'Medical'},{name:'Litters with straps',cat:'Medical',fmc:4,note:'OPORD 4.a.4'},
 {name:'Field medic pack 1',cat:'Medical',fmc:1,chips:12,note:'Ruck + 4 × 10 lb sandbags + 12 chips at STARTEX'},
 {name:'Field medic pack 2',cat:'Medical',fmc:1,chips:12,note:'Ruck + 4 × 10 lb sandbags + 12 chips at STARTEX'},
 {name:'Field medic pack 3',cat:'Medical',fmc:1,chips:12,note:'Ruck + 4 × 10 lb sandbags + 12 chips at STARTEX'},
 {name:'Toolbox',cat:'Mission gear',fmc:1,note:'Required to set up or destroy field equipment (Annex B III.1)'},
 {name:'LMR radios',cat:'Comms',loc:'Charging dock',note:'A2/6 issues at STARTEX and collects at ENDEX'},
 {name:'Two-way walkie-talkies',cat:'Comms',note:'On-base use only'},{name:'Maps',cat:'Mission gear',note:'Instructor provided'}];
function seedEquip(){SEED.forEach(e=>{const id='e'+uid();writeDoc('equip',id,Object.assign({fmc:'',pmc:'',nmc:'',loc:'',note:'',chips:''},e))});logIt({type:'equip',text:'Loaded OPORD / Annex B equipment issue list'})}

function gearDlg(pid){const g=gearOf(pid);const items=Object.entries(S.equip).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
  openDlg(`<form class="dlg" id="gform" data-pid="${pid}"><h3>Gear · ${esc(nm(pid))}</h3>
  ${Object.keys(g).length?`<div class="tablewrap"><table style="min-width:0"><thead><tr><th>Item</th><th>Qty</th><th>Serial / #</th><th>Issued</th><th></th></tr></thead><tbody class="tnum">${Object.entries(g).map(([eid,x])=>`<tr><td>${esc(S.equip[eid]?.name||'Removed item')}</td><td>${esc(x.qty||1)}</td><td class="mono small">${esc(x.serial||'')}</td><td class="small muted">${fmtDT(x.ts)}</td><td><button type="button" class="btn sm" data-ret="${pid}|${esc(eid)}">Return</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small" style="margin:0">Nothing issued to this person.</p>'}
  ${items.length?`<div class="fields"><label class="wide">Issue item<select name="eid">${opt([['','Choose item'],...items.map(([id,e])=>[id,e.name])],'')}</select></label><label>Qty<input name="qty" type="number" min="1" value="1"></label><label>Serial / # (optional)<input name="serial" autocomplete="off"></label></div>`:'<p class="small muted" style="margin:0">Add equipment on the Equipment tab first.</p>'}</form>
  <div class="dfoot"><div class="left"><button type="button" class="btn sm ghost" data-person="${pid}">Status</button></div><button type="button" class="btn ghost" data-act="close">Close</button>${items.length?'<button type="button" class="btn pri" data-act="issue">Issue</button>':''}</div>`)}
function serialsDlg(eid){const e=S.equip[eid];if(!e)return;
  const seen={};ROSTER.forEach(p=>{const s=String(gearOf(p.pid)[eid]?.serial||'').trim().toLowerCase();if(s)(seen[s]=seen[s]||[]).push(p.pid)});
  openDlg(`<form class="dlg" id="sform" data-eid="${esc(eid)}"><h3>Serials · ${esc(e.name)}</h3>
  <p class="small muted" style="margin:0">Type a serial next to each name. A serial issues the item to that person if they don't have it yet. Leave a box blank to skip.</p>
  <details><summary class="small" style="cursor:pointer;font-weight:600">Paste from a hand receipt</summary>
   <p class="small muted" style="margin:6px 0">One person per line: name, then serial, e.g. <span class="mono">Stratton, Zachary  W123456</span>. The last word on each line is read as the serial.</p>
   <textarea id="spaste" rows="5" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--soft)"></textarea>
   <div class="tools"><button type="button" class="btn sm" data-act="fillpaste">Fill boxes from list</button><span class="small" id="pastemsg"></span></div></details>
  <div class="picker" style="max-height:min(55vh,460px)">${ROSTER.map(p=>{const g=gearOf(p.pid)[eid];const s=g?.serial||'';const dup=s&&seen[s.toLowerCase()]?.length>1;
    return `<label style="grid-template-columns:1fr 150px"><span>${esc(p.name)} <span class="small muted">${p.flt}</span>${g?'':' <span class="small muted">· not issued</span>'}${dup?' <span class="pill e-NMC">duplicate</span>':''}</span><input class="mono" data-spid="${p.pid}" value="${esc(s)}" autocomplete="off" style="padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--soft);font-size:13px"></label>`}).join('')}</div></form>
  <div class="dfoot"><div class="left"><button type="button" class="btn sm ghost" data-equip="${esc(eid)}">Back</button></div><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="button" class="btn pri" data-act="saveserials">Save serials</button></div>`)}
function fillPaste(){const txt=document.getElementById('spaste').value;let ok=0;const miss=[];
  txt.split(/\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{const parts=line.split(/[\s\t]+/);if(parts.length<2){miss.push(line);return}
    const serial=parts.pop().replace(/[,;]$/,'');const name=parts.join(' ').replace(/[,;]+$/,'').toLowerCase().replace(/\s+/g,' ');
    const last=name.split(/[ ,]+/)[0];const rest=name.slice(last.length).replace(/[ ,]+/g,' ').trim();
    let c=ROSTER.filter(p=>p.name.toLowerCase().split(',')[0].trim()===last);
    if(c.length>1&&rest)c=c.filter(p=>(p.name.toLowerCase().split(',')[1]||'').trim().startsWith(rest.split(' ')[0]));
    if(c.length===1){const inp=document.querySelector(`[data-spid="${c[0].pid}"]`);if(inp){inp.value=serial;ok++}}else miss.push(line)});
  document.getElementById('pastemsg').textContent=`Filled ${ok}.`+(miss.length?` Not matched: ${miss.slice(0,4).join(' | ')}${miss.length>4?' …':''}`:'')}
function saveSerials(){const f=document.getElementById('sform');const eid=f.dataset.eid;const name=S.equip[eid]?.name||'item';
  const vals={};f.querySelectorAll('[data-spid]').forEach(i=>vals[i.dataset.spid]=i.value.trim());
  const cnt={};Object.values(vals).filter(Boolean).forEach(v=>cnt[v.toLowerCase()]=(cnt[v.toLowerCase()]||0)+1);
  const dups=Object.keys(cnt).filter(k=>cnt[k]>1);if(dups.length){toast('Duplicate serial: '+dups.slice(0,3).join(', ')+'. Fix it before saving.');return}
  let issued=0,changed=0;
  ROSTER.forEach(p=>{const v=vals[p.pid];const g=gearOf(p.pid);const cur=g[eid];
    if(!v&&!cur)return;if(cur&&String(cur.serial||'')===v)return;
    if(!cur&&v){setGear(p.pid,Object.assign({},g,{[eid]:{qty:1,serial:v,ts:Date.now()}}));issued++}
    else if(cur){setGear(p.pid,Object.assign({},g,{[eid]:Object.assign({},cur,{serial:v})}));changed++}});
  if(issued||changed)logIt({type:'gear',text:`${name} serials recorded: ${changed} updated${issued?`, ${issued} newly issued`:''}`});
  toast(issued||changed?'Serials saved':'No changes');closeDlg()}
function issueGear(){const f=document.getElementById('gform');const fd=new FormData(f);const pid=f.dataset.pid;const eid=fd.get('eid');if(!eid){toast('Choose an item to issue.');return}
  const qty=Math.max(1,Number(fd.get('qty')||1));const serial=String(fd.get('serial')||'').trim();const g=Object.assign({},gearOf(pid));const had=g[eid];
  g[eid]={qty,serial,ts:Date.now()};setGear(pid,g);
  logIt({type:'gear',pid,text:`${had?'Updated':'Issued'} ${qty} × ${S.equip[eid]?.name||'item'}${serial?' (#'+serial+')':''} ${had?'for':'to'} ${nm(pid)}`});gearDlg(pid)}
function returnGear(pid,eid){const g=Object.assign({},gearOf(pid));const x=g[eid];if(!x)return;delete g[eid];setGear(pid,g);
  logIt({type:'gear',pid,text:`${nm(pid)} returned ${x.qty||1} × ${S.equip[eid]?.name||'item'}${x.serial?' (#'+x.serial+')':''}`});gearDlg(pid)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){openDlg(`<div class="dlg"><h3>Copy this text</h3><textarea rows="12" style="width:100%" readonly>${esc(t)}</textarea></div><div class="dfoot"><button type="button" class="btn" data-act="close">Close</button></div>`)}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-cyedit],[data-go],[data-aar],[data-ops],[data-serials],[data-gear],[data-ret],[data-day],[data-tab],[data-person],[data-mission],[data-mstate],[data-equip],[data-resupply],[data-rs],[data-act],[data-setstatus]');if(!t)return;
  if(t.dataset.cyedit){cyoaDlg(t.dataset.cyedit);return}
  if(t.dataset.go){goDlg(t.dataset.go);return}
  if(t.dataset.aar){aarDlg(t.dataset.aar);return}
  if(t.dataset.ops){const [id,ev]=t.dataset.ops.split('|');opsEvent(id,ev);return}
  if(t.dataset.serials){serialsDlg(t.dataset.serials);return}
  if(t.dataset.gear){gearDlg(t.dataset.gear);return}
  if(t.dataset.ret){const [pid,eid]=t.dataset.ret.split('|');returnGear(pid,eid);return}
  if(t.dataset.day){UI.day=t.dataset.day;render();return}
  if(t.dataset.tab){UI.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t.dataset.setstatus){const s=dlg.querySelector('select[name=status]');if(s){s.value=t.dataset.setstatus;dlg.querySelectorAll('[data-setstatus]').forEach(b=>b.classList.toggle('pri',b===t))}return}
  if(t.dataset.mstate){const [id,st]=t.dataset.mstate.split('|');setMissionState(id,st);return}
  if(t.dataset.rs){const [id,st]=t.dataset.rs.split('|');setResupply(id,st);return}
  if(t.dataset.mission){missionDlg(t.dataset.mission);return}
  if(t.dataset.person){personDlg(t.dataset.person);return}
  if(t.dataset.equip){equipDlg(t.dataset.equip);return}
  if(t.dataset.resupply){resupplyDlg(t.dataset.resupply);return}
  const a=t.dataset.act;const A=()=>analyze();
  if(a==='close')closeDlg();
  else if(a==='saveperson')savePerson();
  else if(a==='issue')issueGear();
  else if(a==='addcyoa')cyoaDlg(null);
  else if(a==='savecyoa')saveCyoa();
  else if(a==='delcyoa'){const id=document.getElementById('cyform').dataset.mid;const m=allMissions().find(x=>x.id===id);setMissionState(id,'Scrubbed');closeDlg()}
  else if(a==='go')saveGo('GO');
  else if(a==='nogo')saveGo('NOGO');
  else if(a==='saveaar')saveAar();
  else if(a==='logops'||a==='logroe'){const f=document.getElementById('opsform');const txt=f.txt.value.trim();if(a==='logops'&&!txt){toast('Type what happened first.');return}
    logIt({type:'ops',ccir:a==='logroe'||f.ccir.checked,text:a==='logroe'?`CCIR ROE violation${txt?': '+txt:''}`:(f.ccir.checked?'CCIR: ':'')+txt});f.txt.value='';f.ccir.checked=false}
  else if(a==='copya3')copy(a3Text(A()));
  else if(a==='turnover')copy(turnoverText(A()));
  else if(a==='fillpaste')fillPaste();
  else if(a==='saveserials')saveSerials();
  else if(a==='issueall'){const id=document.getElementById('eform').dataset.eid;let n=0;ROSTER.forEach(p=>{const g=gearOf(p.pid);if(!g[id]){setGear(p.pid,Object.assign({},g,{[id]:{qty:1,serial:'',ts:Date.now()}}));n++}});logIt({type:'gear',text:`Issued 1 × ${S.equip[id]?.name} to ${n} personnel`});equipDlg(id)}
  else if(a==='returnall'){const id=document.getElementById('eform').dataset.eid;let n=0;ROSTER.forEach(p=>{const g=Object.assign({},gearOf(p.pid));if(g[id]){delete g[id];setGear(p.pid,g);n++}});logIt({type:'gear',text:`${S.equip[id]?.name} returned by ${n} personnel`});equipDlg(id)}
  else if(a==='who'){openDlg(`<form class="dlg" id="whoform"><h3>Your name for the log</h3><div class="fields"><label class="wide">Name or role (e.g. Stratton A1/4)<input name="who" maxlength="40" value="${esc(ME||'')}"></label></div><p class="small muted" style="margin:0">Saved on this device only. Every change you make is tagged with it.</p></form><div class="dfoot"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="button" class="btn pri" data-act="savewho">Save</button></div>`)}
  else if(a==='savewho'){const v=new FormData(document.getElementById('whoform')).get('who').trim();ME=v||null;try{v?localStorage.setItem('tftiger-who',v):localStorage.removeItem('tftiger-who')}catch(e){}closeDlg();render()}
  else if(a==='rtd'){dlg.querySelector('select[name=status]').value='EFF';const es=dlg.querySelector('select[name=exStatus]');if(es.value&&es.value!=='Complete')es.value='Complete';dlg.querySelector('input[name=tocNotified]').checked=false;savePerson({_rtd:true})}
  else if(a==='tofloor'){const f=document.getElementById('pform');const pid=f.dataset.pid;const an=A();const base=an.c[pid]-Number(person(pid).adj||0);f.querySelector('input[name=adj]').value=an.fl-base}
  else if(a==='addmission')missionDlg(null,true);
  else if(a==='savemission')saveMission();
  else if(a==='resetmission'){const id=document.getElementById('mform').dataset.mid;deleteDoc('missions',id);logIt({type:'msn',mid:id,text:`${id} reset to the Team Assignments plan`});closeDlg()}
  else if(a==='delmission'){const id=document.getElementById('mform').dataset.mid;const m=allMissions().find(x=>x.id===id);writeDoc('missions',id,Object.assign({},S.missions[id],{deleted:true}));logIt({type:'msn',text:`Mission removed: Day ${m.day} ${m.lane} ${m.start}`});closeDlg()}
  else if(a==='addequip')equipDlg(null);
  else if(a==='saveequip')saveEquip();
  else if(a==='delequip'){const id=document.getElementById('eform').dataset.eid;const n=S.equip[id]?.name;deleteDoc('equip',id);logIt({type:'equip',ccir:true,text:`Equipment removed from board: ${n}`});closeDlg()}
  else if(a==='seedequip')seedEquip();
  else if(a==='addresupply')resupplyDlg(null);
  else if(a==='saveresupply')saveResupply();
  else if(a==='delresupply'){const id=document.getElementById('rform').dataset.rid;deleteDoc('resupply',id);closeDlg()}
  else if(a==='equalize'){const an=A();const prev=DAYS[DAYS.findIndex(d=>d.id===UI.day)-1];[...staffOn(prev.id,an.ms)].filter(x=>an.c[x]<an.fl).forEach(x=>{const p=person(x);const base=an.c[x]-Number(p.adj||0);const n=Object.assign({},S.people[x]||{},{adj:an.fl-base});writeDoc('people',x,n)});logIt({type:'adm',text:`${prev.name} WOC/TOC staff set to participation floor ${an.fl} (Annex B II.3)`})}
  else if(a==='copya1')copy(cubText('a1',A()));
  else if(a==='copya4')copy(cubText('a4',A()));
  else if(a==='copylog'){const ls=Object.values(S.log).filter(l=>!l.toc).sort((a,b)=>a.ts-b.ts);copy(ls.map(l=>`${fmtT(l.ts)} ${l.text}`).join('\n')||'Nothing pending')}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){UI.q=e.target.value;render()}
  if(e.target.id==='crewq'){const q=e.target.value.toLowerCase();document.querySelectorAll('#picker label').forEach(l=>l.style.display=l.dataset.n.includes(q)?'':'none')}
});
document.addEventListener('change',e=>{
  if(e.target.dataset.cy){const [id,k]=e.target.dataset.cy.split('|');toggleCy(id,k,e.target.checked);return}
  if(e.target.id==='pf'){UI.pf=e.target.value;render()}
  if(e.target.id==='lf'){UI.lf=e.target.value;render()}
  if(e.target.name==='crew'){const c=document.querySelectorAll('#picker input:checked').length;const s=document.getElementById('crewct');if(s)s.textContent=c+' selected'}
  if(e.target.dataset.toc){const id=e.target.dataset.toc;const l=S.log[id];if(l){writeDoc('log',id,Object.assign({},l,{toc:e.target.checked}));
    if(l.type==='cas'&&l.pid&&e.target.checked){const latest=Object.values(S.log).filter(x=>x.type==='cas'&&x.pid===l.pid).sort((a,b)=>b.ts-a.ts)[0];if(latest===S.log[id]||latest.ts===l.ts){writeDoc('people',l.pid,Object.assign({},S.people[l.pid]||{},{tocNotified:true}))}}}}
  if(e.target.name==='status'&&e.target.form&&e.target.form.id==='pform'){dlg.querySelectorAll('[data-setstatus]').forEach(b=>b.classList.toggle('pri',b.dataset.setstatus===e.target.value))}
});
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDlg()});
setInterval(render,30000);

/* ---------- boot (Firebase) ---------- */
render();
function subscribe(){unsubs.forEach(u=>u());unsubs=[];
  ['people','missions','equip','resupply'].forEach(c=>unsubs.push(FB.onSnapshot(FB.collection(FB.db,c),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S[c]=o;MODE='live';render()},err=>{MODE='error';toast('Live sync stopped: '+(err.code||'error')+'. Reload the page.');render()})));
  unsubs.push(FB.onSnapshot(FB.query(FB.collection(FB.db,'log'),FB.orderBy('ts','desc'),FB.limit(600)),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.log=o;render()},()=>{}));
}
window.bootFirebase=function(){
  const C=window.FIREBASE_CONFIG;
  if(!C||!C.apiKey||String(C.apiKey).startsWith('PASTE')){MODE='setup';render();return}
  const app=FB.initializeApp(C);FB.db=FB.getFirestore(app);CAN_EDIT=true;
  try{ME=localStorage.getItem('tftiger-who')||null}catch(e){}
  subscribe();render();
};
</script>
